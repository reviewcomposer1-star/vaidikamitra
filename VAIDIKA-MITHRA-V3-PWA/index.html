<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Vaidika Mithra — Digital Companion for Vaidika Practitioners</title>
  <meta name="description" content="A scholarly, trustworthy digital operating system for Vedic students and Purohitas.">
  <meta name="theme-color" content="#B85D19">
  <link rel="manifest" href="./manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Gayathri:wght@400;700&family=Manrope:wght@400;500;600;700&family=Noto+Serif+Malayalam:wght@400;600;700&family=Rozha+One&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="h-full bg-vedic-sand dark:bg-vedic-granite text-vedic-charcoal dark:text-vedic-sand font-body antialiased flex flex-col transition-colors duration-200">

<body class="h-full bg-vedic-sand dark:bg-vedic-granite text-vedic-charcoal dark:text-vedic-sand font-body antialiased flex flex-col transition-colors duration-200">

  <!-- TOP HEADER -->
  <header class="sticky top-0 z-40 bg-vedic-cardLight/95 dark:bg-vedic-cardDark/95 backdrop-blur border-b border-vedic-borderLight dark:border-vedic-borderDark transition-colors">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="App.navigate('today')">
        <div class="w-9 h-9 rounded-lg bg-vedic-ochre/10 dark:bg-vedic-ochre/20 border border-vedic-ochre/30 flex items-center justify-center text-vedic-ochre">
          <i data-lucide="compass" class="w-5 h-5"></i>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <span class="font-heading font-bold text-lg tracking-wider text-vedic-ochre">VAIDIKA MITHRA</span>
            <span class="text-[10px] px-1.5 py-0.5 rounded uppercase font-semibold bg-vedic-ochre/15 text-vedic-ochreDark dark:text-vedic-sandal">V1</span>
          </div>
          <p class="text-[10px] text-gray-500 dark:text-gray-400 -mt-0.5 tracking-wide" id="header-subtag">Digital Vaidika Companion</p>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <!-- Search Trigger -->
        <button onclick="App.openSearch()" class="p-2 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-black/5 dark:hover:bg-white/5 transition" title="Global Search (Ctrl+K)">
          <i data-lucide="search" class="w-5 h-5"></i>
        </button>

        <!-- Global Add (+) -->
        <button onclick="App.openAddModal()" class="flex items-center space-x-1.5 px-3 py-1.5 rounded-lg bg-vedic-ochre hover:bg-vedic-ochreDark text-white font-medium text-xs shadow-sm transition">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span class="hidden sm:inline" id="btn-label-add">Add</span>
        </button>

        <!-- Language Switcher Quick Pill -->
        <button onclick="App.toggleLanguage()" class="px-2.5 py-1 rounded-lg border border-vedic-borderLight dark:border-vedic-borderDark text-xs font-semibold hover:border-vedic-ochre transition">
          <span id="lang-indicator">മലയാളം</span>
        </button>

        <!-- Settings -->
        <button onclick="App.navigate('settings')" class="p-2 rounded-lg text-gray-600 dark:text-gray-300 hover:bg-black/5 dark:hover:bg-white/5 transition">
          <i data-lucide="settings" class="w-5 h-5"></i>
        </button>
      </div>
    </div>

    <!-- Secondary Nav Bar for Desktop/Tablet Viewports -->
    <nav class="hidden md:flex border-t border-vedic-borderLight/60 dark:border-vedic-borderDark/60 bg-vedic-parchment/50 dark:bg-vedic-charcoal/50 text-xs font-medium">
      <div class="max-w-5xl mx-auto px-4 flex items-center space-x-6 h-10 w-full overflow-x-auto">
        <button onclick="App.navigate('today')" class="nav-desktop-tab hover:text-vedic-ochre flex items-center space-x-1" data-tab="today"><i data-lucide="calendar" class="w-3.5 h-3.5"></i> <span>Today</span></button>
        <button onclick="App.navigate('events')" class="nav-desktop-tab hover:text-vedic-ochre flex items-center space-x-1" data-tab="events"><i data-lucide="clock" class="w-3.5 h-3.5"></i> <span>Events</span></button>
        <button onclick="App.navigate('panchanga')" class="nav-desktop-tab hover:text-vedic-ochre flex items-center space-x-1" data-tab="panchanga"><i data-lucide="calendar-days" class="w-3.5 h-3.5"></i> <span>Panchanga</span></button>
        <button onclick="App.navigate('sukta')" class="nav-desktop-tab hover:text-vedic-ochre flex items-center space-x-1" data-tab="sukta"><i data-lucide="book-open" class="w-3.5 h-3.5"></i> <span>Suktam</span></button>
        <button onclick="App.navigate('devata')" class="nav-desktop-tab hover:text-vedic-ochre flex items-center space-x-1" data-tab="devata"><i data-lucide="sun" class="w-3.5 h-3.5"></i> <span>Devata</span></button>
        <button onclick="App.navigate('karma')" class="nav-desktop-tab hover:text-vedic-ochre flex items-center space-x-1" data-tab="karma"><i data-lucide="flame" class="w-3.5 h-3.5"></i> <span>Karma</span></button>
        <button onclick="App.navigate('texts')" class="nav-desktop-tab hover:text-vedic-ochre flex items-center space-x-1" data-tab="texts"><i data-lucide="scroll" class="w-3.5 h-3.5"></i> <span>Granthangal</span></button>
        <button onclick="App.navigate('vrata')" class="nav-desktop-tab hover:text-vedic-ochre flex items-center space-x-1" data-tab="vrata"><i data-lucide="sunrise" class="w-3.5 h-3.5"></i> <span>Vrata</span></button>
        <button onclick="App.navigate('tools')" class="nav-desktop-tab hover:text-vedic-ochre flex items-center space-x-1" data-tab="tools"><i data-lucide="disc" class="w-3.5 h-3.5"></i> <span>Tools</span></button>
        <button onclick="App.navigate('favourites')" class="nav-desktop-tab hover:text-vedic-ochre flex items-center space-x-1" data-tab="favourites"><i data-lucide="bookmark" class="w-3.5 h-3.5"></i> <span>Favourites</span></button>
      </div>
    </nav>
  </header>

  <!-- MAIN SCROLLABLE CONTENT AREA -->
  <main id="app-viewport" class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 pb-28 md:pb-12 overflow-y-auto">
    <!-- View container will be injected dynamically -->
  </main>

  <!-- BOTTOM NAVIGATION BAR (Mobile Primary) -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 z-40 bg-vedic-cardLight/95 dark:bg-vedic-cardDark/95 backdrop-blur border-t border-vedic-borderLight dark:border-vedic-borderDark px-2 py-1 flex justify-around items-center text-[10px] font-medium">
    <button onclick="App.navigate('today')" class="nav-btn flex flex-col items-center py-1 px-2 text-gray-500 dark:text-gray-400" data-page="today"><i data-lucide="calendar" class="w-5 h-5 mb-0.5"></i><span>Today</span></button>
    <button onclick="App.navigate('events')" class="nav-btn flex flex-col items-center py-1 px-2 text-gray-500 dark:text-gray-400" data-page="events"><i data-lucide="clock" class="w-5 h-5 mb-0.5"></i><span>Events</span></button>
    <button onclick="App.navigate('panchanga')" class="nav-btn flex flex-col items-center py-1 px-2 text-gray-500 dark:text-gray-400" data-page="panchanga"><i data-lucide="calendar-days" class="w-5 h-5 mb-0.5"></i><span>Panchanga</span></button>
    <button onclick="App.navigate('sukta')" class="nav-btn flex flex-col items-center py-1 px-2 text-gray-500 dark:text-gray-400" data-page="sukta"><i data-lucide="book-open" class="w-5 h-5 mb-0.5"></i><span>Suktam</span></button>
    <button onclick="App.openMoreMenu()" class="nav-btn flex flex-col items-center py-1 px-2 text-gray-500 dark:text-gray-400"><i data-lucide="grid" class="w-5 h-5 mb-0.5"></i><span>More</span></button>
  </nav>

  <!-- MORE SHEETS MODAL (Mobile Overflow) -->
  <div id="more-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-end justify-center transition-opacity" onclick="App.closeMoreMenu(event)">
    <div class="bg-vedic-cardLight dark:bg-vedic-cardDark w-full max-w-md rounded-t-2xl p-5 border-t border-vedic-borderLight dark:border-vedic-borderDark shadow-2xl" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between pb-3 border-b border-vedic-borderLight dark:border-vedic-borderDark"><h3 class="font-heading font-semibold text-sm tracking-wider uppercase">Vaidika Modules</h3><button onclick="App.closeMoreMenu()" class="text-gray-400"><i data-lucide="x" class="w-5 h-5"></i></button></div>
      <div class="grid grid-cols-3 gap-3 py-4 text-center text-xs font-medium">
        <div onclick="App.navigate('devata'); App.closeMoreMenu();" class="p-3 rounded-xl bg-vedic-parchment/60 dark:bg-vedic-charcoal/60 border border-transparent cursor-pointer"><i data-lucide="sun" class="w-6 h-6 mx-auto mb-1 text-vedic-ochre"></i><span>Devata</span></div>
        <div onclick="App.navigate('karma'); App.closeMoreMenu();" class="p-3 rounded-xl bg-vedic-parchment/60 dark:bg-vedic-charcoal/60 border border-transparent cursor-pointer"><i data-lucide="flame" class="w-6 h-6 mx-auto mb-1 text-vedic-ochre"></i><span>Karma</span></div>
        <div onclick="App.navigate('texts'); App.closeMoreMenu();" class="p-3 rounded-xl bg-vedic-parchment/60 dark:bg-vedic-charcoal/60 border border-transparent cursor-pointer"><i data-lucide="scroll" class="w-6 h-6 mx-auto mb-1 text-vedic-ochre"></i><span>Granthangal</span></div>
        <div onclick="App.navigate('vrata'); App.closeMoreMenu();" class="p-3 rounded-xl bg-vedic-parchment/60 dark:bg-vedic-charcoal/60 border border-transparent cursor-pointer"><i data-lucide="sunrise" class="w-6 h-6 mx-auto mb-1 text-vedic-ochre"></i><span>Vrata</span></div>
        <div onclick="App.navigate('tools'); App.closeMoreMenu();" class="p-3 rounded-xl bg-vedic-parchment/60 dark:bg-vedic-charcoal/60 border border-transparent cursor-pointer"><i data-lucide="disc" class="w-6 h-6 mx-auto mb-1 text-vedic-ochre"></i><span>Tools</span></div>
        <div onclick="App.navigate('favourites'); App.closeMoreMenu();" class="p-3 rounded-xl bg-vedic-parchment/60 dark:bg-vedic-charcoal/60 border border-transparent cursor-pointer"><i data-lucide="bookmark" class="w-6 h-6 mx-auto mb-1 text-vedic-ochre"></i><span>Favourites</span></div>
        <div onclick="App.navigate('settings'); App.closeMoreMenu();" class="p-3 rounded-xl bg-vedic-parchment/60 dark:bg-vedic-charcoal/60 border border-transparent cursor-pointer"><i data-lucide="settings" class="w-6 h-6 mx-auto mb-1 text-vedic-ochre"></i><span>Settings</span></div>
      </div>
    </div>
  </div>

  <!-- GLOBAL ADD (+) MODAL -->
  <div id="add-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4" onclick="App.closeAddModal(event)">
    <div class="bg-vedic-cardLight dark:bg-vedic-cardDark w-full max-w-lg rounded-2xl p-6 border border-vedic-borderLight dark:border-vedic-borderDark shadow-2xl space-y-4" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between pb-3 border-b border-vedic-borderLight dark:border-vedic-borderDark">
        <div>
          <h3 class="font-heading font-bold text-base text-vedic-ochre" data-i18n="add.title">Add / Record</h3>
          <p class="text-xs text-gray-500" data-i18n="add.subtitle">What would you like to create?</p>
        </div>
        <button onclick="App.closeAddModal()" class="text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <!-- Option buttons -->
      <div class="grid grid-cols-2 gap-3" id="add-options-grid">
        <button onclick="App.initNewItem('event')" class="flex items-center space-x-3 p-3 rounded-xl border border-vedic-borderLight dark:border-vedic-borderDark hover:border-vedic-ochre bg-vedic-parchment/30 dark:bg-vedic-charcoal/40 text-left transition">
          <div class="w-9 h-9 rounded-lg bg-vedic-ochre/15 flex items-center justify-center text-vedic-ochre"><i data-lucide="calendar-plus" class="w-5 h-5"></i></div>
          <div>
            <div class="font-semibold text-xs" data-i18n="add.type.event">Ritual Event</div>
            <div class="text-[10px] text-gray-500">Homa, Vrata, Pūjā</div>
          </div>
        </button>

        <button onclick="App.initNewItem('counter')" class="flex items-center space-x-3 p-3 rounded-xl border border-vedic-borderLight dark:border-vedic-borderDark hover:border-vedic-ochre bg-vedic-parchment/30 dark:bg-vedic-charcoal/40 text-left transition">
          <div class="w-9 h-9 rounded-lg bg-vedic-sandal/20 flex items-center justify-center text-vedic-ochre"><i data-lucide="activity" class="w-5 h-5"></i></div>
          <div>
            <div class="font-semibold text-xs" data-i18n="add.type.counter">Japa Counter</div>
            <div class="text-[10px] text-gray-500">Mantra chanting tracker</div>
          </div>
        </button>

        <button onclick="App.initNewItem('note')" class="flex items-center space-x-3 p-3 rounded-xl border border-vedic-borderLight dark:border-vedic-borderDark hover:border-vedic-ochre bg-vedic-parchment/30 dark:bg-vedic-charcoal/40 text-left transition">
          <div class="w-9 h-9 rounded-lg bg-vedic-moss/20 flex items-center justify-center text-vedic-moss"><i data-lucide="edit-3" class="w-5 h-5"></i></div>
          <div>
            <div class="font-semibold text-xs" data-i18n="add.type.note">Purohita Note</div>
            <div class="text-[10px] text-gray-500">Dravya list, references</div>
          </div>
        </button>

        <button onclick="App.initNewItem('devata')" class="flex items-center space-x-3 p-3 rounded-xl border border-vedic-borderLight dark:border-vedic-borderDark hover:border-vedic-ochre bg-vedic-parchment/30 dark:bg-vedic-charcoal/40 text-left transition opacity-75">
          <div class="w-9 h-9 rounded-lg bg-amber-500/15 flex items-center justify-center text-amber-600"><i data-lucide="sun" class="w-5 h-5"></i></div>
          <div>
            <div class="font-semibold text-xs" data-i18n="add.type.devata">Devata Record</div>
            <div class="text-[10px] text-gray-500">Custom invocation scheme</div>
          </div>
        </button>
      </div>

      <!-- Dynamic Form Container -->
      <div id="add-form-container" class="hidden pt-2 border-t border-vedic-borderLight dark:border-vedic-borderDark">
        <!-- Injected per type -->
      </div>
    </div>
  </div>

  <!-- GLOBAL SEARCH MODAL -->
  <div id="search-modal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-start justify-center pt-16 px-4" onclick="App.closeSearch(event)">
    <div class="bg-vedic-cardLight dark:bg-vedic-cardDark w-full max-w-2xl rounded-2xl p-4 border border-vedic-borderLight dark:border-vedic-borderDark shadow-2xl space-y-3" onclick="event.stopPropagation()">
      <div class="relative flex items-center">
        <i data-lucide="search" class="w-5 h-5 text-gray-400 absolute left-3"></i>
        <input type="text" id="global-search-input" oninput="App.executeSearch(this.value)" placeholder="Search Devata, Sukta, Text, Karma, Mantra or Events..." class="w-full pl-10 pr-10 py-3 bg-vedic-parchment/50 dark:bg-vedic-charcoal rounded-xl text-sm border border-vedic-borderLight dark:border-vedic-borderDark focus:outline-none focus:border-vedic-ochre">
        <button onclick="App.closeSearch()" class="absolute right-3 text-gray-400 hover:text-gray-600"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <div id="search-results" class="max-h-96 overflow-y-auto divide-y divide-vedic-borderLight dark:divide-vedic-borderDark text-xs">
        <div class="py-8 text-center text-gray-500">Type to search through verified Vedic knowledge and personal records...</div>
      </div>
    </div>
  </div>

  <!-- AUDIO PLAYER DOCKED BAR (Sticky when active) -->
  <div id="persistent-audio-player" class="fixed bottom-14 md:bottom-0 left-0 right-0 z-30 bg-vedic-charcoal text-white border-t border-vedic-borderDark shadow-2xl transform transition-transform duration-300 translate-y-full">
    <div class="max-w-5xl mx-auto px-4 py-2.5 flex flex-col md:flex-row md:items-center justify-between gap-2">
      <!-- Title & Attribution -->
      <div class="flex items-center space-x-3 min-w-0 flex-1">
        <div class="w-9 h-9 rounded-lg bg-vedic-ochre/20 flex items-center justify-center text-vedic-ochre shrink-0">
          <i data-lucide="music" class="w-4 h-4"></i>
        </div>
        <div class="truncate">
          <h4 id="audio-title" class="font-semibold text-xs truncate">Śrī Sūktam</h4>
          <p id="audio-source" class="text-[10px] text-gray-400 truncate">Audio will be provided later</p>
        </div>
      </div>

      <!-- Controls -->
      <div class="flex items-center justify-between md:justify-center space-x-3 w-full md:w-auto">
        <!-- 10 Sec Back -->
        <button onclick="AudioEngine.seekRelative(-10)" class="p-1.5 text-gray-300 hover:text-white" title="-10 Seconds">
          <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
        </button>

        <!-- Play/Pause -->
        <button id="player-play-btn" onclick="AudioEngine.togglePlay()" class="w-9 h-9 rounded-full bg-vedic-ochre hover:bg-vedic-ochreDark text-white flex items-center justify-center shadow">
          <i data-lucide="play" class="w-4 h-4 ml-0.5" id="player-play-icon"></i>
        </button>

        <!-- 10 Sec Forward -->
        <button onclick="AudioEngine.seekRelative(10)" class="p-1.5 text-gray-300 hover:text-white" title="+10 Seconds">
          <i data-lucide="rotate-cw" class="w-4 h-4"></i>
        </button>

        <!-- Speed Cycle Button: 1x -> 1.25x -> 1.5x -> 1x -->
        <button id="player-speed-btn" onclick="AudioEngine.cycleSpeed()" class="px-2 py-0.5 rounded text-[11px] font-bold border border-gray-600 hover:border-vedic-ochre text-gray-200">
          1×
        </button>

        <!-- Time Track -->
        <span id="player-time-display" class="text-[10px] font-mono text-gray-400">00:00 / 00:00</span>

        <!-- Close / Minimize -->
        <button onclick="AudioEngine.closePlayer()" class="p-1 text-gray-400 hover:text-gray-200 ml-2">
          <i data-lucide="chevron-down" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Progress Slider -->
      <div class="w-full md:max-w-xs flex items-center">
        <input id="player-progress" type="range" min="0" max="100" value="0" oninput="AudioEngine.seekPercentage(this.value)" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-vedic-ochre">
      </div>
    </div>
  </div>

  <audio id="core-audio-element" preload="none" class="hidden"></audio>

  <!-- ========================================================= -->
  <!-- JAVASCRIPT ARCHITECTURE & MODULES                          -->
  <!-- ========================================================= -->

<script src="./js/core/config.js"></script>
<script src="./js/core/storage.js"></script>
<script src="./js/core/locales.js"></script>
<script src="./js/data/devata.js"></script>
<script src="./js/data/suktas.js"></script>
<script src="./js/data/karma.js"></script>
<script src="./js/data/texts.js"></script>
<script src="./js/data/vrata.js"></script>
<script src="./js/engines/panchanga.js"></script>
<script src="./js/components/audio-player.js"></script>
<script src="./js/app/app.js"></script>
<script src="./js/pages/pages.js"></script>
<script src="./js/app/v2-customizations.js"></script>
<script src="./js/app/main.js"></script>
</body>
</html>
